[project]
name = "wavin-wtc-net"
version = "0.1.0"
description = "Wavin WTC-NET Home Assistant integration (local Modbus TCP)"
readme = "docs/README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["pymodbus>=3.8.0"]

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component>=0.13.316"]
dev = ["pytest-homeassistant-custom-component>=0.13.316", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["hardware: opt-in read-only validation against a real endpoint (never in CI)"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "BLE"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components"]

[[tool.mypy.overrides]]
module = ["pymodbus", "pymodbus.*"]
ignore_missing_imports = true
